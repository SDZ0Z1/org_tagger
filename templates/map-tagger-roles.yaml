# StackSet map-tagger-roles：部署到整个组织并自动部署，每个账号只部署到一个 region
# 本文件由 make_templates.py 生成，不要手动修改。

AWSTemplateFormatVersion: "2010-09-09"
Description: "org-tagger: MapTaggerRole 和 MapRealtimeTaggerRole。每个成员账号只部署到一个 region。"
Parameters:
  PayerAccountId:
    Type: "String"
    AllowedPattern: "^[0-9]{12}$"
    Description: "Payer（管理账号）的账号 ID"
  MappingParameterArn:
    Type: "String"
    AllowedPattern: "^arn:aws:ssm:[a-z0-9-]+:[0-9]{12}:parameter/.+$"
    Description: "账号映射表 SSM 参数的完整 ARN，如 arn:aws:ssm:ap-southeast-1:123456789012:parameter/map-tagger/accounts"
  TagKey:
    Type: "String"
    Default: "map-migrated"
    Description: "标签 key"
Resources:
  MapTaggerRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: "MapTaggerRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              AWS:
                Fn::Sub: "arn:${AWS::Partition}:iam::${PayerAccountId}:role/MapSweepLambdaRole"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: "MapTagger"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "ListAndReadTags"
                Effect: "Allow"
                Action:
                  - "tag:GetResources"
                  - "ec2:DescribeRegions"
                  - "ec2:DescribeInstances"
                  - "ec2:DescribeVolumes"
                  - "ec2:DescribeSnapshots"
                  - "ec2:DescribeImages"
                  - "ec2:DescribeAddresses"
                  - "ec2:DescribeNatGateways"
                  - "ec2:DescribeVpcEndpoints"
                  - "rds:DescribeDBInstances"
                  - "rds:DescribeDBClusters"
                  - "rds:DescribeDBSnapshots"
                  - "rds:DescribeDBClusterSnapshots"
                  - "lambda:ListFunctions"
                  - "lambda:ListTags"
                  - "elasticloadbalancing:DescribeLoadBalancers"
                  - "elasticloadbalancing:DescribeTags"
                  - "dynamodb:ListTables"
                  - "dynamodb:DescribeTable"
                  - "dynamodb:ListTagsOfResource"
                  - "elasticfilesystem:DescribeFileSystems"
                  - "elasticache:DescribeCacheClusters"
                  - "elasticache:ListTagsForResource"
                  - "eks:ListClusters"
                  - "eks:DescribeCluster"
                  - "s3:ListAllMyBuckets"
                  - "s3:GetBucketLocation"
                  - "s3:GetBucketTagging"
                  - "cloudfront:ListDistributions"
                  - "cloudfront:ListTagsForResource"
                Resource: "*"
              - Sid: "TagFirstLayerTypes"
                Effect: "Allow"
                Action:
                  - "tag:TagResources"
                  - "ec2:CreateTags"
                  - "rds:AddTagsToResource"
                  - "lambda:TagResource"
                  - "elasticloadbalancing:AddTags"
                  - "dynamodb:TagResource"
                  - "elasticfilesystem:TagResource"
                  - "elasticache:AddTagsToResource"
                  - "eks:TagResource"
                  - "s3:PutBucketTagging"
                  - "cloudfront:TagResource"
                Resource: "*"
              - Sid: "TagOtherTypes"
                Effect: "Allow"
                Action:
